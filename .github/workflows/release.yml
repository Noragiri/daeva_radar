# Every push to main: run the offline tests, then publish a release with the app as a zip.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false  # one release per push, in order

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline decoder / tracker tests
        run: python dev/test_daeva_radar.py

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # all tags and history, for the notes

      - name: Version
        id: version
        run: |
          version="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          # git archive honours export-ignore in .gitattributes (dev/, .github/, the machine-specific .lnk).
          # VERSION tells the installed copy which release it is (the in-app updater compares it).
          echo "${{ steps.version.outputs.version }}" > VERSION
          git archive --format=zip --prefix=DaevaRadar/ --add-file=VERSION -o "DaevaRadar-${{ steps.version.outputs.version }}.zip" HEAD
          unzip -l "DaevaRadar-${{ steps.version.outputs.version }}.zip" | tail -n 1

      - name: Release notes
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          {
            echo "Build of \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
            echo
            echo "Unzip, then start \`Daeva Radar.bat\` (Windows, run \`python daeva_radar.py --shortcut\` once for a shortcut) or \`daeva_radar.sh\` (Linux). See README.md."
            echo
            if [ -n "$previous" ]; then
              echo "### Changes since $previous"
              git log --no-merges --format='- %s (%h)' "$previous..HEAD"
            else
              echo "### Changes"
              git log --no-merges --format='- %s (%h)' -n 20
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "DaevaRadar-${{ steps.version.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "Daeva Radar ${{ steps.version.outputs.version }}" \
            --notes-file notes.md
